name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an older run on the same branch when a newer commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm run test:unit

  database-tests:
    name: Integration and end-to-end tests (PostGIS)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: wayfare
          POSTGRES_PASSWORD: wayfare_ci
          # The test setup refuses any database whose name doesn't end in "_test".
          POSTGRES_DB: wayfare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wayfare -d wayfare_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://wayfare:wayfare_ci@localhost:5432/wayfare_test
      TEST_DATABASE_URL: postgres://wayfare:wayfare_ci@localhost:5432/wayfare_test
      # Tests always use the fictional dataset; their expectations depend on it.
      SEED_DATASET: synthetic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Integration tests (real PostgreSQL + PostGIS)
        run: npm run test:integration
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end and accessibility tests
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
